  /* ---------- Fundo ilustrado (campo + tratores, SVG original) ---------- */

  .tela{ max-width: 900px; width:100%; text-align:center; position:relative; z-index:1; }

  .cards{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .card{
    background: rgba(255,255,255,.42);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.55);
    border-radius: 14px;
    padding: 44px 28px;
    text-decoration:none;
    color: inherit;
    text-shadow: 0 1px 2px rgba(255,255,255,.5);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:5px;
  }
  .card.tratores::before{ background: var(--tratores); }
  .card.transportes::before{ background: var(--transportes); }
  .card:hover{
    transform: translateY(-5px);
    box-shadow: 0 18px 36px rgba(30,41,59,.16);
  }
  .card.tratores:hover{ border-color: var(--tratores); }
  .card.transportes:hover{ border-color: var(--transportes); }

  .icone{
    width: 68px; height:68px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-size: 32px;
    margin-bottom: 20px;
  }
  .card.tratores .icone{ background: rgba(234,240,254,.85); }
  .card.transportes .icone{ background: rgba(227,241,235,.85); }

  .card h2{
    font-family:'Oswald', sans-serif;
    font-size: 21px;
    font-weight:600;
    margin: 0 0 8px;
    letter-spacing: 0.02em;
  }
  .card.tratores h2{ color: var(--tratores-dark); }
  .card.transportes h2{ color: var(--transportes-dark); }

  .card p{
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0;
    line-height:1.5;
  }

  @media (max-width: 620px){
    .cards{ grid-template-columns: 1fr; }
  }

  /* ---------- Tela de login ---------- */
  .tela-login{
    position: fixed; inset: 0; background: #1e293b;
    display:flex; align-items:center; justify-content:center; padding: 20px; z-index: 2000;
  }
  .login-card{
    background: #fff; border-radius: 12px; padding: 36px 30px;
    max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .login-logo{ font-size: 34px; margin-bottom: 6px; }
  .login-card h2{ font-family:'Oswald', sans-serif; font-size: 19px; margin: 0 0 6px; color: var(--ink); }
  .login-card p{ font-size: 12.5px; color: var(--ink-soft); margin: 0 0 18px; }
  .login-card input{
    width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; font-size: 14px; margin-bottom: 10px; font-family: inherit;
  }
  .login-card button{
    width: 100%; border: none; border-radius: 6px; background: #1e40af; color: #fff;
    font-weight: 600; font-size: 14px; padding: 11px; cursor: pointer;
  }
  .login-card button:hover{ background: #1c3a94; }
  .login-card button:disabled{ background: #94a3b8; cursor: not-allowed; }
  .login-erro{ color: #dc2626; font-size: 12.5px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>

<div id="tela-login" class="tela-login">
  <div class="login-card">
    <div class="login-logo">🔒</div>
    <h2>ALMA</h2>
    <p>Entre com seu e-mail e senha para acessar os sistemas.</p>
    <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username">
    <input type="password" id="loginSenha" placeholder="Senha" autocomplete="current-password">
    <button type="button" id="btn-login">Entrar</button>
    <div id="loginErro" class="login-erro"></div>
  </div>
</div>

<div id="app-conteudo" style="display:none;">
  <div class="tela">
    <div class="cards">
      <a class="card tratores" href="tratores.html">
        <div class="icone">🚜</div>
        <h2>ALMA TRATORES</h2>
        <p>Emissão de Ordens de Serviço — peças, mão de obra e orçamentos.</p>
      </a>

      <a class="card transportes" href="fretes.html">
        <div class="icone">🚛</div>
        <h2>ALMA TRANSPORTES</h2>
        <p>Controle de fretes, clientes e cálculo de rotas.</p>
      </a>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAkTfgLDLIe7q7n3Pzix_50Sz-hMiyAlkU",
    authDomain: "sistema-alma-tratores.firebaseapp.com",
    projectId: "sistema-alma-tratores",
    storageBucket: "sistema-alma-tratores.firebasestorage.app",
    messagingSenderId: "904624946557",
    appId: "1:904624946557:web:87ba09360ffbd187156014"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  function fazerLoginApp(){
    const email = document.getElementById('loginEmail').value.trim();
    const senha = document.getElementById('loginSenha').value;
    const erroEl = document.getElementById('loginErro');
    const btn = document.getElementById('btn-login');
    erroEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Entrando…';
    auth.signInWithEmailAndPassword(email, senha).catch(() => {
      erroEl.textContent = 'E-mail ou senha incorretos.';
    }).finally(() => {
      btn.disabled = false;
      btn.textContent = 'Entrar';
    });
  }
  document.getElementById('btn-login').addEventListener('click', fazerLoginApp);
  document.getElementById('loginSenha').addEventListener('keydown', e => { if (e.key === 'Enter') fazerLoginApp(); });

  auth.onAuthStateChanged(user => {
    document.getElementById('tela-login').style.display = user ? 'none' : 'flex';
    document.getElementById('app-conteudo').style.display = user ? 'block' : 'none';
  });
</script>
</body>
</html>
